[workspace]
resolver = "2"
members = [
    "crates/exactscope-kernel",
    "crates/exactscope-pack",
    "crates/exactscope-grounding",
    "crates/exactscope-cabi",
    "crates/exactscope-wasm",
    "crates/exactscope-tinyjson",
    "crates/exactscope-packc",
    "crates/exactscope-conformance",
]
default-members = [
    "crates/exactscope-kernel",
    "crates/exactscope-pack",
    "crates/exactscope-grounding",
    "crates/exactscope-cabi",
    "crates/exactscope-wasm",
    "crates/exactscope-tinyjson",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ot4562-glitch/ExactScope"
homepage = "https://github.com/ot4562-glitch/ExactScope"
authors = ["ExactScope contributors"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
alloc_instead_of_core = "deny"
std_instead_of_core = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[profile.dev]
overflow-checks = true

# v1 stable support is intentionally narrow: the packaged Linux x86-64 native
# grounding C ABI/software path. Other targets remain separately qualified and
# must not inherit physical-device performance claims from x86-64 evidence.
