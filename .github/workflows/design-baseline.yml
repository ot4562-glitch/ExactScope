name: design-baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exactscope-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.98.0"
  RUST_MSRV: "1.84.0"

jobs:
  design-contracts:
    name: Design contracts and C ABI headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install design validator dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate schemas, registries, examples, catalog, ABI constants, and links
        run: python tools/validate_design.py

      - name: Check dependency attribution and SPDX inventory
        run: python tools/check_licenses.py

      - name: Validate llama.cpp direct-eval adapter envelope
        run: python adapters/llama-cpp/direct_eval_smoke.py --self-test

      - name: Compile public headers as C11
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude -fsyntax-only tests/abi/header_c.c

      - name: Compile public headers as C++11
        run: c++ -std=c++11 -Wall -Wextra -Werror -pedantic -Iinclude -fsyntax-only tests/abi/header_cpp.cpp

  rust-scaffold:
    name: Rust scaffold / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Report toolchain
        shell: bash
        run: rustc "+$RUST_TOOLCHAIN" --version --verbose

      - name: Validate Cargo metadata
        shell: bash
        run: cargo "+$RUST_TOOLCHAIN" metadata --no-deps --format-version 1

      - name: Check formatting
        shell: bash
        run: cargo "+$RUST_TOOLCHAIN" fmt --all --check

      - name: Check workspace
        shell: bash
        run: cargo "+$RUST_TOOLCHAIN" check --workspace --all-targets

      - name: Lint workspace
        shell: bash
        run: cargo "+$RUST_TOOLCHAIN" clippy --workspace --all-targets -- -D warnings

      - name: Test workspace scaffold
        shell: bash
        run: cargo "+$RUST_TOOLCHAIN" test --workspace

      - name: Validate benchmark corpus against real Tiny JSON core
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo "+$RUST_TOOLCHAIN" build --package exactscope-conformance --bin exactscope-core
          python3 benchmarks/run_benchmark.py --self-test --core target/debug/exactscope-core

      - name: Lint dynamic-pack C ABI feature
        shell: bash
        run: cargo "+$RUST_TOOLCHAIN" clippy --package exactscope-cabi --features dynamic-packs --all-targets -- -D warnings

      - name: Test dynamic-pack C ABI feature
        shell: bash
        run: cargo "+$RUST_TOOLCHAIN" test --package exactscope-cabi --features dynamic-packs

      - name: Build reproducible canonical scope-pack artifact
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p target/conformance
          cargo "+$RUST_TOOLCHAIN" run --quiet --package exactscope-packc -- spec/examples/econ-undergrad-minimal.xsp.json target/conformance/econ-undergrad-minimal.xsp
          cargo "+$RUST_TOOLCHAIN" run --quiet --package exactscope-packc -- spec/examples/econ-undergrad-minimal.xsp.json target/conformance/econ-undergrad-minimal.second.xsp
          cmp target/conformance/econ-undergrad-minimal.xsp target/conformance/econ-undergrad-minimal.second.xsp
          sha256sum target/conformance/econ-undergrad-minimal.xsp > target/conformance/econ-undergrad-minimal.xsp.sha256
          rm target/conformance/econ-undergrad-minimal.second.xsp

      - name: Verify generated hot-set assets
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          rm -rf target/hotset-check-p0 target/hotset-check-econ8 target/hotset-check-stats8 target/hotset-check-quant16
          cargo "+$RUST_TOOLCHAIN" run --quiet --package exactscope-packc -- hotset hotsets/p0-smoke.json target/hotset-check-p0
          cargo "+$RUST_TOOLCHAIN" run --quiet --package exactscope-packc -- hotset hotsets/econ-core-8.json target/hotset-check-econ8
          cargo "+$RUST_TOOLCHAIN" run --quiet --package exactscope-packc -- hotset hotsets/statistics-core-8.json target/hotset-check-stats8
          cargo "+$RUST_TOOLCHAIN" run --quiet --package exactscope-packc -- hotset hotsets/quant-core-16.json target/hotset-check-quant16
          diff -ru adapters/generated/p0-smoke target/hotset-check-p0
          diff -ru adapters/generated/econ-core-8 target/hotset-check-econ8
          diff -ru adapters/generated/statistics-core-8 target/hotset-check-stats8
          diff -ru adapters/generated/quant-core-16 target/hotset-check-quant16

      - name: Upload canonical scope-pack artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: econ-undergrad-minimal-xsp
          path: |
            target/conformance/econ-undergrad-minimal.xsp
            target/conformance/econ-undergrad-minimal.xsp.sha256
          if-no-files-found: error

  msrv:
    name: Rust 1.84 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV and portable Wasm target
        run: rustup toolchain install "$RUST_MSRV" --profile minimal --target wasm32v1-none

      - name: Check native workspace at MSRV
        run: cargo "+$RUST_MSRV" check --workspace --all-targets

      - name: Check no_std kernel at MSRV
        run: cargo "+$RUST_MSRV" check --package exactscope-kernel --target wasm32v1-none --no-default-features

      - name: Check no_std pack layer at MSRV
        run: cargo "+$RUST_MSRV" check --package exactscope-pack --target wasm32v1-none --no-default-features

      - name: Check dynamic-pack C ABI feature at MSRV
        run: cargo "+$RUST_MSRV" check --package exactscope-cabi --features dynamic-packs --all-targets

  wasm-baseline:
    name: WebAssembly 1.0 no_std scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust and wasm32v1-none
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32v1-none

      - name: Check kernel
        run: cargo "+$RUST_TOOLCHAIN" check --package exactscope-kernel --target wasm32v1-none --no-default-features

      - name: Check pack loader
        run: cargo "+$RUST_TOOLCHAIN" check --package exactscope-pack --target wasm32v1-none --no-default-features

      - name: Check Tiny JSON adapter
        run: cargo "+$RUST_TOOLCHAIN" check --package exactscope-tinyjson --target wasm32v1-none --no-default-features

      - name: Check WebAssembly wrapper
        run: cargo "+$RUST_TOOLCHAIN" check --package exactscope-wasm --target wasm32v1-none --no-default-features

      - name: Build fused Tiny JSON WebAssembly artifact
        run: cargo "+$RUST_TOOLCHAIN" build --release --package exactscope-wasm --target wasm32v1-none --no-default-features --features fused,tinyjson

      - name: Inspect no-import WebAssembly artifact
        run: python tools/inspect_wasm.py target/wasm32v1-none/release/exactscope_wasm.wasm

      - name: Execute fused WebAssembly wire conformance
        run: node tools/test_wasm.mjs target/wasm32v1-none/release/exactscope_wasm.wasm

      - name: Execute public dependency-free xs_calc Wasm example
        run: node examples/javascript/wasm-xs-calc.mjs target/wasm32v1-none/release/exactscope_wasm.wasm

  evaluation-bundle:
    name: Prerelease evaluation bundle / Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust and portable Wasm target
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32v1-none

      - name: Build native static library
        run: cargo "+$RUST_TOOLCHAIN" rustc --release --package exactscope-cabi --lib --features standalone-staticlib --crate-type staticlib

      - name: Build benchmark core executable
        run: cargo "+$RUST_TOOLCHAIN" build --release --package exactscope-conformance --bin exactscope-core

      - name: Compile and execute public xs_calc C11 example
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude examples/c/xs_calc.c target/release/libexactscope_cabi.a -o /tmp/exactscope-xs-calc
          /tmp/exactscope-xs-calc

      - name: Build no-import Wasm evaluation artifact
        run: cargo "+$RUST_TOOLCHAIN" build --release --package exactscope-wasm --target wasm32v1-none --no-default-features --features fused,tinyjson

      - name: Build deterministic release-shaped evaluation archive
        run: >-
          python3 tools/package_evaluation_bundle.py build
          --native-target x86_64-unknown-linux-gnu
          --native-library target/release/libexactscope_cabi.a
          --core-executable target/release/exactscope-core
          --wasm target/wasm32v1-none/release/exactscope_wasm.wasm
          --source-commit "$GITHUB_SHA"
          --toolchain "rustc-$RUST_TOOLCHAIN-linux-gnu"
          --output-dir target/evaluation-bundles

      - name: Verify evaluation archive integrity
        run: python3 tools/package_evaluation_bundle.py verify target/evaluation-bundles/exactscope-eval-1.0.0-rc.1-x86_64-unknown-linux-gnu.tar.gz

      - name: Run clean-room evaluation without Rust source/build access
        run: python3 tools/test_evaluation_bundle.py target/evaluation-bundles/exactscope-eval-1.0.0-rc.1-x86_64-unknown-linux-gnu.tar.gz

      - name: Upload prerelease evaluation bundle
        uses: actions/upload-artifact@v4
        with:
          name: exactscope-eval-linux-x86_64
          path: target/evaluation-bundles/exactscope-eval-1.0.0-rc.1-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
