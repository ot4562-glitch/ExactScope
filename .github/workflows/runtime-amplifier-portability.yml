name: runtime-amplifier-portability-experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "adapters/openai-compatible/**"
      - "tools/grounding_*.py"
      - "tools/package_runtime_amplifier_zipapp.py"
      - "tools/test_openai_compatible_adapter.py"
      - "tools/test_portable_runtime_amplifier.py"
      - ".github/workflows/runtime-amplifier-portability.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  portable-python:
    name: portable amplifier / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify zero-dependency runtime core
        run: |
          python tools/test_grounding_corpus.py
          python tools/test_grounding_projection.py
          python tools/test_openai_compatible_adapter.py
          python tools/test_portable_runtime_amplifier.py

      - name: Build deterministic portable amplifier
        run: python tools/package_runtime_amplifier_zipapp.py build --output exactscope-amplifier.pyz

      - name: Verify portable amplifier inventory
        run: python tools/package_runtime_amplifier_zipapp.py verify exactscope-amplifier.pyz

      - name: Execute packaged plan
        run: python exactscope-amplifier.pyz plan --profile grounding/reference-profile-v0.1 --question "What is the capital of France?"
