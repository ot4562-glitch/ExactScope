name: format-helper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustfmt-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Format Rust workspace
        run: cargo +1.98.0 fmt --all

      - name: Capture formatter patch
        run: git diff --binary > rustfmt.patch

      - name: Upload formatter patch
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
