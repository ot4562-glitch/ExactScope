name: wearable-edge-profile

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  wearable-contract:
    name: Wearable edge contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validator dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate repository design contracts
        run: python tools/validate_design.py

      - name: Validate wearable product profile
        run: python tools/validate_wearable_profile.py

      - name: Validate wearable qualification evidence and claim logic
        run: python tools/validate_wearable_qualification.py --self-test

      - name: Compile wearable reference host as C99
        run: cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude -Iadapters/wearable -fsyntax-only adapters/wearable/exactscope_wearable_ref.c tests/wearable/reference_host_c.c

      - name: Compile wearable reference header as C++11
        run: c++ -std=c++11 -Wall -Wextra -Werror -pedantic -Iinclude -Iadapters/wearable -fsyntax-only tests/wearable/reference_host_cpp.cpp

      - name: Build wearable A/B crash-consistency test
        run: cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude -Iadapters/wearable adapters/wearable/exactscope_wearable_ab.c tests/wearable/ab_update_test.c -o /tmp/exactscope-ab-update-test

      - name: Execute wearable A/B power-loss matrix
        run: /tmp/exactscope-ab-update-test

      - name: Build wearable target benchmark stream test
        run: cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude -Iadapters/wearable adapters/wearable/exactscope_wearable_bench.c tests/wearable/benchmark_stream_test.c -o /tmp/exactscope-benchmark-stream-test

      - name: Execute wearable target benchmark stream test
        run: /tmp/exactscope-benchmark-stream-test

      - name: Verify wearable latency reducer and percentile rules
        run: python tools/reduce_wearable_latency.py --self-test

      - name: Verify deterministic wearable SDK packager
        run: python tools/package_wearable_sdk.py --self-test

      - name: Configure-test relocatable CMake SDK package
        run: python tools/test_cmake_sdk.py

      - name: Verify OEM SDK doctor
        run: python tools/exactscope_doctor.py --self-test

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy

      - name: Install wearable native cross targets
        run: rustup target add --toolchain "$RUST_TOOLCHAIN" aarch64-linux-android aarch64-unknown-linux-musl

      - name: Build native C ABI static library
        run: cargo "+$RUST_TOOLCHAIN" rustc --release --package exactscope-cabi --lib --features dynamic-packs,standalone-staticlib --crate-type staticlib

      - name: Link wearable C99 host against real Rust static library
        run: cc -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude -Iadapters/wearable adapters/wearable/exactscope_wearable_ref.c tests/wearable/reference_runtime_test.c target/release/libexactscope_cabi.a -o /tmp/exactscope-wearable-runtime-test

      - name: Execute real native C ABI wearable flow
        run: /tmp/exactscope-wearable-runtime-test

      - name: Cross-build Android arm64 static library
        run: cargo "+$RUST_TOOLCHAIN" rustc --release --target aarch64-linux-android --package exactscope-cabi --lib --features dynamic-packs,standalone-staticlib --crate-type staticlib

      - name: Cross-build embedded Linux arm64 static library
        run: cargo "+$RUST_TOOLCHAIN" rustc --release --target aarch64-unknown-linux-musl --package exactscope-cabi --lib --features dynamic-packs,standalone-staticlib --crate-type staticlib

      - name: Verify cross-target static library artifacts
        run: |
          test -s target/aarch64-linux-android/release/libexactscope_cabi.a
          test -s target/aarch64-unknown-linux-musl/release/libexactscope_cabi.a
          ls -lh target/aarch64-linux-android/release/libexactscope_cabi.a
          ls -lh target/aarch64-unknown-linux-musl/release/libexactscope_cabi.a

      - name: Package Android arm64 OEM SDK
        run: python tools/package_wearable_sdk.py --target aarch64-linux-android --library target/aarch64-linux-android/release/libexactscope_cabi.a --output-dir dist --source-commit "$GITHUB_SHA" --toolchain "rustc $RUST_TOOLCHAIN"

      - name: Package embedded Linux arm64 OEM SDK
        run: python tools/package_wearable_sdk.py --target aarch64-unknown-linux-musl --library target/aarch64-unknown-linux-musl/release/libexactscope_cabi.a --output-dir dist --source-commit "$GITHUB_SHA" --toolchain "rustc $RUST_TOOLCHAIN"

      - name: Verify packaged OEM SDK archives
        run: |
          python tools/package_wearable_sdk.py --verify dist/exactscope-wearable-sdk-0.1.0-alpha.0-aarch64-linux-android.tar.gz --target aarch64-linux-android
          python tools/package_wearable_sdk.py --verify dist/exactscope-wearable-sdk-0.1.0-alpha.0-aarch64-unknown-linux-musl.tar.gz --target aarch64-unknown-linux-musl
          sha256sum dist/*.tar.gz

      - name: Upload wearable OEM SDK archives
        uses: actions/upload-artifact@v7
        with:
          name: exactscope-wearable-oem-sdks
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Check deterministic conformance harness
        run: cargo "+$RUST_TOOLCHAIN" test --package exactscope-conformance

      - name: Check dynamic-pack C ABI wearable boundary
        run: cargo "+$RUST_TOOLCHAIN" test --package exactscope-cabi --features dynamic-packs

      - name: Lint dynamic-pack C ABI wearable boundary
        run: cargo "+$RUST_TOOLCHAIN" clippy --package exactscope-cabi --features dynamic-packs --all-targets -- -D warnings
